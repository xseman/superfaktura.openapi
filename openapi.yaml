    /expenses/add:
        post:
            summary: Add new expense
            description: |
                Add new expense. To add tags, send `Tag: {"Tag": [tagId, ...]}`
                next to `Expense`. An attachment can be sent base64 encoded in
                `Expense.attachment`.
            tags:
                - Expenses
            requestBody:
                description: '`Expense.name` is required.'
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ExpenseCreateReq"
                        examples:
                            simple:
                                value:
                                    Expense:
                                        name: Foo bar
                                        currency: EUR
                                        amount: 12.14
                            multipleVatRates:
                                value:
                                    Expense:
                                        name: Expense with multiple VAT rates
                                        vat: 21
                                        amount: 100
                                        vat2: 10
                                        amount2: 100
                                        vat3: 0
                                        amount3: 100
                            withItems:
                                value:
                                    Expense:
                                        name: Expense with items
                                    ExpenseItem:
                                        -   description: description of item 1
                                            name: item 1
                                            tax: 20
                                            unit_price: 10
                            withClient:
                                value:
                                    Expense:
                                        name: Client inside
                                        currency: EUR
                                        amount: 12.14
                                    Client:
                                        name: Comp Any Ltd
                                        ico: '12345678'
                                        comment: no comment
                                        update_addressbook: 1
                                        iban: XX00000000001
                                        swift: '98765'
            responses:
                200:
                    description: |
                        Successful creation. Validation problems (e.g. document
                        number not matching the period) are returned with
                        `error: 1` and an object in `error_message`.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ExpenseSaveRes"
                400:
                    description: Missing data
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Chýbajúce údaje
                                message: Chýbajúce údaje
                403:
                    description: Insufficient privileges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Ako používateľ typu Hosť nemáte oprávnenie na túto akciu.
                                message: Ako používateľ typu Hosť nemáte oprávnenie na túto akciu.

    /expenses/edit:
        post:
            summary: Edit expense
            description: |
                It's strongly recommended to fetch the expense, change the
                required values and then request edit. Attributes are the same
                as for *Add expense*, `name` is optional and `Expense.id` is
                required. Expense items with `id` are updated, items without
                `id` are created.
            tags:
                - Expenses
            requestBody:
                description: '`Expense.id` is required, all other attributes are optional.'
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ExpenseCreateReq"
                        examples:
                            simple:
                                value:
                                    Expense:
                                        id: 1
                                        name: Foo bar
                                        currency: EUR
                                        amount: 19.95
                                        due: '2148-01-01'
                            withItems:
                                value:
                                    Expense:
                                        id: 30
                                        name: Expense with items edited
                                    ExpenseItem:
                                        -   id: 32
                                            description: Description of item 1
                                            name: Item 1
                                            tax: 25
                                            unit_price: 100
                                        -   description: Description of new item
                                            name: Item 2
                                            tax: 15
                                            quantity: 1
                                            unit_price: 100
            responses:
                200:
                    description: Successfully edited
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ExpenseSaveRes"
                400:
                    description: Bad data format / missing expense ID
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 3
                                error_message: Bad data format.
                403:
                    description: Insufficient privileges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Ako používateľ typu Hosť nemáte oprávnenie na túto akciu.
                                message: Ako používateľ typu Hosť nemáte oprávnenie na túto akciu.
                404:
                    description: Wrong expense
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Expense not found
                                message: Expense not found
                500:
                    description: Unable to save
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 5
                                error_message: The expense could not be saved. Please, try again.
                                message: The expense could not be saved. Please, try again.

    /expenses/view/{id}.json:
        get:
            summary: Expense detail
            description: |
                When the expense version is `items`, the number of `amount*`
                and `vat*` attributes equals the number of expense items.
            tags:
                - Expenses
            parameters:
                -   in: path
                    name: id
                    required: true
                    description: Expense ID
                    schema:
                        type: integer
            responses:
                200:
                    description: Successfully show details
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ExpenseDetail"
                404:
                    description: Wrong expense
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Expense not found
                                message: Expense not found

    /expenses/downloadAttachment/{expense_id}:
        get:
            summary: Download all expense attachments
            description: |
                Download all attachments of the expense as a `.zip` file
                (equivalent to `attachment_id` = 0).
            tags:
                - Expenses
            parameters:
                -   in: path
                    name: expense_id
                    required: true
                    description: Expense ID
                    schema:
                        type: integer
            responses:
                200:
                    description: Binary file response
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
                default:
                    description: Error (not found, forbidden, expense ID is 0)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AttachmentError"

    /expenses/downloadAttachment/{expense_id}/{attachment_id}:
        get:
            summary: Download expense attachment
            description: |
                Download one specific attachment attached to the expense. If
                `attachment_id` is 0, all attachments are downloaded as a
                `.zip` file.
            tags:
                - Expenses
            parameters:
                -   in: path
                    name: expense_id
                    required: true
                    description: Expense ID
                    schema:
                        type: integer
                -   in: path
                    name: attachment_id
                    required: true
                    description: Attachment ID within the expense (0 = all attachments as zip)
                    schema:
                        type: integer
                        default: 0
            responses:
                200:
                    description: Binary file response
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
                default:
                    description: Error (not found, forbidden, expense ID is 0)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AttachmentError"
                            examples:
                                notFound:
                                    value:
                                        error_code: 0
                                        error: Príloha č.666 nebola nájdená pre náklad č.666
                                forbidden:
                                    value:
                                        error_code: 0
                                        error: Náklad neexistuje, alebo Vám nepatrí
                                zeroExpenseId:
                                    value:
                                        error_code: 0
                                        error: Číslo nákladu musí byť uvedené.

    /expenses/index.json/listinfo:1:
        get:
            summary: Get list of expenses
            description: |
                Parameters are passed as named parameters
                (e.g. `/expenses/index.json/listinfo:1/per_page:1/page:2/sort:ico`).
                `listinfo:1` is part of the path so the response always contains
                paging information. Without it the API returns a plain array of
                items (not modelled here).
            tags:
                - Expenses
            parameters:
                -   in: query
                    name: amount_from
                    description: Minimum amount of money
                    schema:
                        type: number
                        format: float
                -   in: query
                    name: amount_to
                    description: Maximum amount of money
                    schema:
                        type: number
                        format: float
                -   in: query
                    name: category
                    description: Expense category ID
                    schema:
                        type: integer
                -   in: query
                    name: client_id
                    description: Client ID
                    schema:
                        type: integer
                -   in: query
                    name: created
                    description: Constant specifying time filtering (see Value lists > Time filter constants)
                    schema:
                        $ref: "#/components/schemas/TimeFilterConstant"
                -   in: query
                    name: modified
                    description: Constant specifying time filtering (see Value lists > Time filter constants)
                    schema:
                        $ref: "#/components/schemas/TimeFilterConstant"
                -   in: query
                    name: created_since
                    description: Created date since (requires `created:3`)
                    schema:
                        type: string
                        format: date
                -   in: query
                    name: created_to
                    description: Created date until (requires `created:3`)
                    schema:
                        type: string
                        format: date
                -   in: query
                    name: modified_since
                    description: Modified date since (requires `modified:3`)
                    schema:
                        type: string
                        format: date
                -   in: query
                    name: modified_to
                    description: Modified date until (requires `modified:3`)
                    schema:
                        type: string
                        format: date
                -   in: query
                    name: delivery
                    description: Constant specifying time filtering (see Value lists > Time filter constants)
                    schema:
                        $ref: "#/components/schemas/TimeFilterConstant"
                -   in: query
                    name: delivery_since
                    description: Delivery date since (requires `delivery:3`)
                    schema:
                        type: string
                        format: date
                -   in: query
                    name: delivery_to
                    description: Delivery date until (requires `delivery:3`)
                    schema:
                        type: string
                        format: date
                -   in: query
                    name: direction
                    description: Sorting direction (ASC or DESC)
                    schema:
                        type: string
                        enum:
                            - ASC
                            - DESC
                        default: DESC
                -   in: query
                    name: due
                    description: Due date
                    schema:
                        type: string
                        format: date
                -   in: query
                    name: page
                    description: Page number
                    schema:
                        type: integer
                        default: 1
                -   in: query
                    name: payment_type
                    description: Payment type (see Value lists > Payment types)
                    schema:
                        $ref: "#/components/schemas/PaymentType"
                -   in: query
                    name: per_page
                    description: Number of items per page (max 100), defaults to the value set in profile
                    schema:
                        type: integer
                        maximum: 100
                -   in: query
                    name: search
                    description: Base64 encoded string (e.g. `test` = `dGVzdA,,`)
                    schema:
                        type: string
                -   in: query
                    name: sort
                    description: Attribute to sort by
                    schema:
                        type: string
                        default: regular_count
                -   in: query
                    name: status
                    description: |
                        Expense status (see Value lists > Expense statuses).
                        Use pipe (`|`) to combine multiple statuses (e.g. `1|2`).
                    schema:
                        type: string
                -   in: query
                    name: type
                    description: Expense type (see Value lists > Expense types)
                    schema:
                        $ref: "#/components/schemas/ExpenseType"
            responses:
                200:
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ExpenseListRes"

