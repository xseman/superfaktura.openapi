    /invoices/create:
        post:
            summary: Create invoice
            description: |
                Create new invoice. At least one invoice item must be specified
                and at least one of its `unit_price` and `name` must be filled.
                To add tags, send `Tag: {"Tag": [tagId, ...]}`. To be able to
                retrieve the response later via
                `/api_logs/getResponseByChecksum/{checksum}`, send a unique
                `checksum` (max 32 characters).
            tags:
                - Invoice
            requestBody:
                description: '`Invoice`, at least one `InvoiceItem` and `Client` with `name` are required.'
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/InvoiceCreateReq"
                        examples:
                            minimal:
                                value:
                                    Invoice:
                                        name: Test API
                                    InvoiceItem:
                                        -   description: description of item 1
                                            name: item 1
                                            tax: 20
                                            unit_price: 10
                                    Client:
                                        name: Company name
                                        ico: '44981082'
                            full:
                                value:
                                    Invoice:
                                        name: Test API
                                        bank_accounts:
                                            -   bank_name: New Bank
                                                iban: SK0000000000000000
                                                swift: '12345'
                                        issued_by: John Doe
                                        issued_by_email: john@d.oe
                                        issued_by_phone: '+9999999'
                                        issued_by_web: https://superfaktura.sk
                                        discount: 10
                                        header_comment: Header comment
                                        internal_comment: Internal comment
                                        invoice_currency: EUR
                                        rounding: item_ext
                                        specific: '123456'
                                        type: proforma
                                        variable: VS87654
                                        created: '2019-02-28'
                                    InvoiceItem:
                                        -   description: description of item 1
                                            name: item 1
                                            tax: 20
                                            unit_price: 10
                                            AccountingDetail:
                                                place: Slovakia
                                                order: PLA
                                                operation: UXW
                                                type: item
                                                analytics_account: '311'
                                                synthetic_account: '000'
                                                preconfidence: 5ZV
                                    Client:
                                        name: Company name
                                        ico: '46655034'
                                        comment: Client comment
                                        update_addressbook: 1
                                        iban: XX00000000001
                                        swift: '98765'
                                    InvoiceSetting:
                                        language: eng
                                        signature: true
                                        payment_info: true
                                        online_payment: true
                                        bysquare: true
                                        paypal: true
                                    InvoiceExtra:
                                        pickup_point_id: 23
                                    MyData:
                                        address: Fiktivna 1
                                        business_register: '-'
                                        city: Prague
                                        company_name: MyData Inc.
                                        country_id: 191
                                        dic: SK99999999
                                        ic_dph: ABCDE
                                        update_profile: '0'
                                        zip: 999 88
            responses:
                200:
                    description: Successful addition
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/InvoiceCreateRes"
                403:
                    description: Insufficient privileges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: You can't create invoice
                                message: You can't create invoice
                500:
                    description: Missing data or bad format
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/InvoiceDataError"
                            example:
                                error: 4
                                error_message:
                                    data_bad_format: Missing required client data.

    /invoices/edit:
        post:
            summary: Edit invoice
            description: |
                Edit invoice. Attributes are the same as for *Create invoice*,
                `Invoice.name` is optional and `Invoice.id` is required.
            tags:
                - Invoice
            requestBody:
                description: '`Invoice` with `id` is required, all other attributes are optional.'
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/InvoiceCreateReq"
                        example:
                            Invoice:
                                id: 2
                                discount: 5
            responses:
                200:
                    description: Successfully edited
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/InvoiceEditRes"
                404:
                    description: Wrong invoice
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Message"
                            example:
                                error: 2
                                message: Invoice ID not found.
                500:
                    description: Wrong ID format / bad data
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Message"
                            example:
                                error: 1
                                message: Bad data format.

    /invoices/setinvoicelanguage/{invoice_id}/lang:{lang}:
        get:
            summary: Set invoice language
            tags:
                - Invoice
            parameters:
                -   in: path
                    name: invoice_id
                    required: true
                    description: Invoice ID
                    schema:
                        type: integer
                -   in: path
                    name: lang
                    required: true
                    description: Invoice language (see Value lists > Language list)
                    schema:
                        $ref: "#/components/schemas/Language"
            responses:
                200:
                    description: Result
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/InvoiceSetLanguageRes"
                            examples:
                                success:
                                    value:
                                        message: Success
                                        status: 1
                                invalidLanguage:
                                    value:
                                        message: Language is not supported.
                                        status: 0
                                permissionDenied:
                                    value:
                                        message: Permission denied.
                                        status: 0

    /invoices/pdf/{invoice_id}/token:{token}:
        get:
            summary: Get invoice PDF
            description: |
                Return invoice PDF file. Optional parameters are passed as
                named parameters (e.g.
                `/invoices/pdf/1275/token:09feb1bd/bysquare:1`). The URL may be
                prefixed with a language code
                (e.g. `/slo/invoices/pdf/1275/token:09feb1bd`).
            tags:
                - Invoice
            parameters:
                -   in: path
                    name: invoice_id
                    required: true
                    description: Invoice ID
                    schema:
                        type: integer
                -   in: path
                    name: token
                    required: true
                    description: Invoice token (`Invoice.token`)
                    schema:
                        type: string
                -   in: query
                    name: bysquare
                    description: Adds QR code to invoice if set to 1 (otherwise the web application setting is used)
                    schema:
                        type: integer
                -   in: query
                    name: paypal
                    description: Adds PayPal button to invoice if set to 1 (otherwise the web application setting is used)
                    schema:
                        type: integer
                -   in: query
                    name: no-signature
                    description: Hides signature on invoice if set to 1 (otherwise the web application setting is used)
                    schema:
                        type: integer
                -   in: query
                    name: language
                    description: Language in which the invoice will be created (defaults to the document language)
                    schema:
                        $ref: "#/components/schemas/Language"
            responses:
                200:
                    description: PDF document
                    content:
                        application/pdf:
                            schema:
                                type: string
                                format: binary
                404:
                    description: Invoice not found

    /{language}/invoices/pdf/{invoice_id}/token:{token}:
        get:
            summary: Get invoice PDF in language
            description: |
                Return invoice PDF file in the language given by the URL
                prefix (e.g. `/slo/invoices/pdf/1275/token:09feb1bd/bysquare:1`).
            tags:
                - Invoice
            parameters:
                -   in: path
                    name: language
                    required: true
                    description: Language in which the invoice will be created (see Value lists > Language list)
                    schema:
                        $ref: "#/components/schemas/Language"
                -   in: path
                    name: invoice_id
                    required: true
                    description: Invoice ID
                    schema:
                        type: integer
                -   in: path
                    name: token
                    required: true
                    description: Invoice token (`Invoice.token`)
                    schema:
                        type: string
                -   in: query
                    name: bysquare
                    description: Adds QR code to invoice if set to 1 (otherwise the web application setting is used)
                    schema:
                        type: integer
                -   in: query
                    name: paypal
                    description: Adds PayPal button to invoice if set to 1 (otherwise the web application setting is used)
                    schema:
                        type: integer
                -   in: query
                    name: no-signature
                    description: Hides signature on invoice if set to 1 (otherwise the web application setting is used)
                    schema:
                        type: integer
            responses:
                200:
                    description: PDF document
                    content:
                        application/pdf:
                            schema:
                                type: string
                                format: binary
                404:
                    description: Invoice not found

    /invoices/view/{invoice_id}.json:
        get:
            summary: Get invoice detail
            tags:
                - Invoice
            parameters:
                -   in: path
                    name: invoice_id
                    required: true
                    description: Invoice ID
                    schema:
                        type: integer
            responses:
                200:
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/InvoiceDetail"
                404:
                    description: Wrong invoice
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Invoice not found
                                message: Invoice not found

    /invoices/getInvoiceDetails/{ids}:
        get:
            summary: Get invoices details
            description: |
                Get information about multiple invoices at once. You can
                specify up to 100 invoice IDs. The response is an object keyed
                by invoice ID.
            tags:
                - Invoice
            parameters:
                -   in: path
                    name: ids
                    description: List of invoice IDs separated by comma
                    required: true
                    schema:
                        type: string
                    example: 1,2
            operationId: getInvoiceDetails
            responses:
                200:
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties:
                                    $ref: "#/components/schemas/InvoiceDetail"
                400:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"

    /invoices/index.json/listinfo:1:
        get:
            summary: Get list of invoices
            description: |
                Retrieve a list of invoices with optional filters and sorting.
                Parameters are passed as named parameters
                (e.g. `/invoices/index.json/listinfo:1/per_page:1/page:2/type:regular`).
                The list returns complete invoice data.
                `listinfo:1` is part of the path so the response always contains
                paging information. Without it the API returns a plain array of
                items (not modelled here).
            tags:
                - Invoice
            parameters:
                -   name: direction
                    in: query
                    description: Sorting direction (ASC or DESC)
                    schema:
                        type: string
                        enum:
                            - ASC
                            - DESC
                        default: DESC
                -   name: page
                    in: query
                    description: Page number
                    schema:
                        type: integer
                        default: 1
                -   name: per_page
                    in: query
                    description: Number of items per page (max 200)
                    schema:
                        type: integer
                        maximum: 200
                -   name: sort
                    in: query
                    description: Attribute to sort by
                    schema:
                        type: string
                        default: regular_count
                -   name: type
                    in: query
                    description: Type of document (see Value lists > Invoice types). Use `|` as separator for multiple values.
                    schema:
                        type: string
                        default: regular
                -   name: amount_from
                    in: query
                    description: Amount from
                    schema:
                        type: number
                        format: float
                        default: 0
                -   name: amount_to
                    in: query
                    description: Amount to
                    schema:
                        type: number
                        format: float
                        default: 0
                -   name: client_id
                    in: query
                    description: Client ID
                    schema:
                        type: integer
                -   name: created
                    in: query
                    description: Constant specifying time filtering (see Value lists > Time filter constants)
                    schema:
                        allOf:
                            -   $ref: '#/components/schemas/TimeFilterConstant'
                        default: 6
                -   name: created_since
                    in: query
                    description: Creation date since (requires `created:3`)
                    schema:
                        type: string
                        format: date
                -   name: created_to
                    in: query
                    description: Creation date to (requires `created:3`)
                    schema:
                        type: string
                        format: date
                -   name: delivery
                    in: query
                    description: Constant specifying time filtering (see Value lists > Time filter constants)
                    schema:
                        $ref: "#/components/schemas/TimeFilterConstant"
                -   name: delivery_since
                    in: query
                    description: Delivery date from (requires `delivery:3`)
                    schema:
                        type: string
                        format: date
                -   name: delivery_to
                    in: query
                    description: Delivery date to (requires `delivery:3`)
                    schema:
                        type: string
                        format: date
                -   name: delivery_type
                    in: query
                    description: Delivery type (see Value lists > Delivery types). Use `|` as separator for multiple values.
                    schema:
                        type: string
                -   name: ignore
                    in: query
                    description: IDs of invoices to be ignored. Use `|` as separator for multiple values.
                    schema:
                        type: string
                -   name: invoice_no_formatted
                    in: query
                    description: Formatted invoice number
                    schema:
                        type: string
                -   name: modified
                    in: query
                    description: Last modification date constant specifying time filtering (see Value lists > Time filter constants)
                    schema:
                        $ref: "#/components/schemas/TimeFilterConstant"
                -   name: modified_since
                    in: query
                    description: Last modification date from (requires `modified:3`)
                    schema:
                        type: string
                        format: date
                -   name: modified_to
                    in: query
                    description: Last modification date to (requires `modified:3`)
                    schema:
                        type: string
                        format: date
                -   name: order_no
                    in: query
                    description: Order number, from which invoice is created
                    schema:
                        type: string
                -   name: paydate
                    in: query
                    description: Constant specifying time filtering (see Value lists > Time filter constants)
                    schema:
                        $ref: "#/components/schemas/TimeFilterConstant"
                -   name: paydate_since
                    in: query
                    description: Pay date since (requires `paydate:3`)
                    schema:
                        type: string
                        format: date
                -   name: paydate_to
                    in: query
                    description: Pay date to (requires `paydate:3`)
                    schema:
                        type: string
                        format: date
                -   name: payment_type
                    in: query
                    description: Payment types (see Value lists > Payment types). Use `|` as separator for multiple values.
                    schema:
                        type: string
                -   name: search
                    in: query
                    description: Base64 encoded string
                    schema:
                        type: string
                -   name: status
                    in: query
                    description: Invoice status (see Value lists > Invoice statuses)
                    schema:
                        type: string
                -   name: tag
                    in: query
                    description: Tag ID
                    schema:
                        type: integer
                -   name: variable
                    in: query
                    description: Variable symbol
                    schema:
                        type: string
            responses:
                200:
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/InvoiceListRes"

    /invoices/delete/{id}:
        get:
            summary: Delete invoice by ID
            tags:
                - Invoice
            parameters:
                -   name: id
                    in: path
                    required: true
                    description: Invoice ID
                    schema:
                        type: integer
            responses:
                200:
                    description: Successful deletion
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Message"
                            example:
                                error: 0
                                message: Invoice deleted
                404:
                    description: Wrong ID or error during deletion
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            examples:
                                notFound:
                                    value:
                                        error: 1
                                        error_message: Invoice not found
                                        message: Invoice not found
                                deletionError:
                                    value:
                                        error: 1
                                        error_message: Invoice could not be deleted
                                        message: Invoice could not be deleted

    /invoices/will_not_be_paid/{id}:
        get:
            summary: Set invoice as "will not be paid"
            description: Only works for regular and proforma invoices.
            tags:
                - Invoice
            parameters:
                -   name: id
                    in: path
                    required: true
                    description: Invoice ID
                    schema:
                        type: integer
            responses:
                200:
                    description: Successfully marked
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/InvoiceWillNotBePaidRes"
                403:
                    description: Insufficient privileges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Nemáte právo meniť faktúru
                                message: Nemáte právo meniť faktúru
                404:
                    description: Wrong invoice
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Document can not be canceled

    /invoice_payments/add/ajax:1/api:1:
        post:
            summary: Pay invoice
            description: Only `regular`, `proforma` and `cancel` invoice types can be paid.
            tags:
                - Invoice
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/InvoicePaymentAddReq"
                        example:
                            InvoicePayment:
                                invoice_id: 1
                                payment_type: cash
                                amount: 12
                                created: '2019-01-01'
                                currency: EUR
            responses:
                200:
                    description: |
                        Successfully added payment. Adding a payment to an
                        already fully paid invoice returns `error: 1` with
                        `message: "Faktúra je už plne uhradená"`.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/InvoicePaymentRes"
                            example:
                                country_exchange_rate: 1
                                created: '2050-01-01'
                                currency: €
                                error: 0
                                exchange_rate: 1
                                flash_message:
                                    text: Úhrada bola uložená
                                    type: success
                                home_currency: €
                                invoice_currency: €
                                invoice_id: 1
                                invoice_type: regular
                                overdue: false
                                paid: 12
                                parent_id: null
                                payment_id: '1'
                                status: 3
                                to_pay: 0
                                to_pay_home_cur: 0
                400:
                    description: Paying invalid invoice type
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Message"
                            example:
                                error: 1
                                message: Invalid document type
                404:
                    description: Invalid ID
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Message"
                            example:
                                error: 1
                                message: Payment not found

    /invoices/send:
        post:
            summary: Send invoice via e-mail
            description: |
                Sends invoice to specified email address. Sending emails has a
                limit of 100 emails / hour.
            tags:
                - Invoice
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/InvoiceSendReq"
                        examples:
                            simple:
                                value:
                                    Email:
                                        invoice_id: 1
                                        to: john.doe@example.com
                                        pdf_language: eng
                            withCc:
                                value:
                                    Email:
                                        bcc:
                                            - foo@example.com
                                        body: api body
                                        cc:
                                            - bar@example.com
                                        invoice_id: 1
                                        pdf_language: deu
                                        subject: api subject
                                        to: john.doe@example.com
            responses:
                200:
                    description: |
                        Successfully sent. Errors are returned as
                        `error: 4` (invoice not found), `error: 13` (invalid
                        recipient email address) or `error: 1` (any other
                        problem).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/InvoiceSendRes"
                            examples:
                                success:
                                    value:
                                        data:
                                            Invoice:
                                                bysquare: true
                                                cc: '[]'
                                                email: john.doe@example.com
                                                invoice_id: '1'
                                                invoice_lang: eng
                                                message: |-
                                                    Dobrý deň,

                                                    v prílohe posielame faktúru č. 2020001.
                                                no-signature: false
                                                payment_info: true
                                                paypal: false
                                                recipient: john.doe@example.com
                                                subject: Faktúra 2020001
                                                trustpay: null
                                        error: 0
                                        error_message: ''
                                invoiceNotFound:
                                    value:
                                        error: 4
                                        error_message: Invoice not found
                                invalidEmail:
                                    value:
                                        error: 13
                                        error_message: Please insert valid recipient email address.
                404:
                    description: Invoice not found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Invoice not found
                                message: Invoice not found

    /invoices/mark_as_sent:
        post:
            summary: Mark invoice as sent via email
            tags:
                - Invoice
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/InvoiceMarkAsSentReq"
                        example:
                            InvoiceEmail:
                                invoice_id: 1
                                email: john.doe@example.com
                                subject: subject
                                message: hello world
            responses:
                200:
                    description: |
                        Successfully marked. Errors: `error: 2` wrong HTTP
                        method, `error: 4` invalid email data (validation
                        errors in `error_messages`), `error: 5` invalid invoice
                        ID.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            examples:
                                success:
                                    value:
                                        error: 0
                                        error_message: Invoice marked as sent
                                wrongMethod:
                                    value:
                                        error: 2
                                        error_message: This method is POST only
                400:
                    description: Invalid data
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 4
                                error_message: Invalid email data
                500:
                    description: Invalid invoice ID
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 5
                                error_message: Invalid invoice id

    /invoices/post:
        post:
            summary: Send invoice via post
            tags:
                - Invoice
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/InvoiceSendPostReq"
                        example:
                            Post:
                                delivery_address: Vymyslena 1
                                delivery_city: Bratislava
                                delivery_country_id: 191
                                delivery_state: Slovensko
                                delivery_name: John Doe
                                delivery_zip: '99999'
                                invoice_id: 1
            responses:
                200:
                    description: Successfully posted
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/InvoiceSendPostRes"
                400:
                    description: Missing address data
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Message"
                            example:
                                error: 6
                                message: Address data error.
                403:
                    description: Not enough post stamps
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Message"
                            example:
