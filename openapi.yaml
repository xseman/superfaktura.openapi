paths:
    /bank_accounts/add:
        post:
            summary: Add new bank account
            description: |
                At least one of `bank_name`, `iban`, `swift`, `bank_account`,
                `bank_code` is required.
            tags:
                - Bank accounts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/BankAccountReq"
            responses:
                200:
                    description: Successful creation
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BankAccountAddRes"
                            example:
                                BankAccount:
                                    bank_name: NovaBanka
                                    country_id: '191'
                                    created: '2050-01-01 23:59:59'
                                    default: 1
                                    iban: SK000011112222333344
                                    id: '2'
                                    modified: '2050-01-01 23:59:59'
                                    show: 1
                                    show_account: 1
                                    swift: suzuki
                                    user_id: '1'
                                    user_profile_id: '1'
                                error: 0
                403:
                    description: Insufficient privileges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Ako používateľ typu Hosť nemáte oprávnenie na túto akciu.
                                message: Ako používateľ typu Hosť nemáte oprávnenie na túto akciu.

    /bank_accounts/update/{id}:
        post:
            summary: Update bank account specified by ID
            tags:
                - Bank accounts
            parameters:
                -   name: id
                    in: path
                    required: true
                    description: Bank account ID
                    schema:
                        type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/BankAccount"
                        example:
                            bank_name: StaroNovaBanka
                            swift: '77777'
            responses:
                200:
                    description: Successful update
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BankAccountUpdateRes"
                            example:
                                error: '0'
                                message:
                                    BankAccount:
                                        account: ''
                                        bank_code: ''
                                        bank_name: StaroNovaBanka
                                        default: true
                                        iban: SK012345678901234567890000
                                        id: 1
                                        modified: '2050-01-01 23:59:59'
                                        show: true
                                        swift: '77777'
                                        user_id: '1'
                                        user_profile_id: '1'
                403:
                    description: Insufficient privileges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Ako používateľ typu Hosť nemáte oprávnenie na túto akciu.
                                message: Ako používateľ typu Hosť nemáte oprávnenie na túto akciu.
                404:
                    description: Wrong bank account
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Bankový účet sa nenašiel
                                message: Bankový účet sa nenašiel

    /bank_accounts/delete/{id}:
        post:
            summary: Delete bank account specified by ID
            tags:
                - Bank accounts
            parameters:
                -   name: id
                    in: path
                    required: true
                    description: Bank account ID
                    schema:
                        type: integer
            responses:
                200:
                    description: Successful deletion
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BankAccountDeleteRes"
                            example:
                                error: '0'
                                message: Bankový účet zmazaný
                403:
                    description: Insufficient privileges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Ako používateľ typu Hosť nemáte oprávnenie na túto akciu.
                                message: Ako používateľ typu Hosť nemáte oprávnenie na túto akciu.
                404:
                    description: Wrong bank account
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Účet neexistuje
                                message: Účet neexistuje

    /bank_accounts/index:
        get:
            summary: Get list of bank accounts
            description: |
                When no bank account is found, `BankAccounts` is an empty
                array.
            tags:
                - Bank accounts
            responses:
                200:
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BankAccountListRes"
                            example:
                                BankAccounts:
                                    -   BankAccount:
                                            account: ''
                                            bank_code: ''
                                            bank_name: FatraBanka
                                            country_id: '191'
                                            created: '2050-01-01 23:59:59'
                                            currency: null
                                            default: true
                                            iban: SK012345678901234567890000
                                            id: '1'
                                            modified: '2050-01-01 23:59:59'
                                            show: true
                                            swift: SUZUKI
                                            user_id: '1'
                                            user_profile_id: '1'
                                error: 0

    /cash_register_items/add:
        post:
            summary: Add cash register item
            description: |
                Add item to cash register. When `invoice_id` is set, the
                response also contains the paid `Invoice`. When `is_eet` is set,
                the response also contains `EetReceipt` and `flag`.
            tags:
                - Cash register item
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CashRegisterItemAddReq"
                        examples:
                            minimal:
                                value:
                                    CashRegisterItem:
                                        amount: 12
                                        cash_register_id: 14
                            eet:
                                value:
                                    CashRegisterItem:
                                        amount: 12
                                        cash_register_id: 8
                                        is_eet: true
                                        created: '2019-02-06 12:05:50'
                                        currency: CZK
                                        cash_item_no_formatted: '2019007'
                            withInvoice:
                                value:
                                    CashRegisterItem:
                                        amount: 12
                                        cash_register_id: 14
                                        created: '2019-02-06 12:05:50'
                                        cash_item_no_formatted: '2019007'
                                        client_id: 431
                                        description: Test description
                                        invoice_id: 1285
            responses:
                200:
                    description: Successful operation
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CashRegisterItemAddRes"
                            example:
                                CashRegister:
                                    sequence_in_no: P2020004
                                    sequence_out_no: V2020001
                                CashRegisterItem:
                                    amount: 14
                                    amount_formatted: 14,00 <span class="currency_symbol">€</span>
                                    cash_item_no: '2020003'
                                    cash_item_no_formatted: P2020003
                                    cash_register_id: 1
                                    created: '2050-01-01 23:59:59'
                                    created_formatted: 01.01.2050
                                    currency: EUR
                                    exchange_rate: 1
                                    id: '6'
                                    sequence_cnt: 3
                                    sequence_id: 6
                                    sequencein_id: 6
                                    sequenceout_id: 7
                                    type: 0
                                Summary:
                                    minus:
                                        formatted: 0,00 <span class="currency_symbol">€</span>
                                        value: null
                                    plus:
                                        formatted: 120,00 <span class="currency_symbol">€</span>
                                        value: '120.00'
                                    total:
                                        formatted: 120,00 <span class="currency_symbol">€</span>
                                        value: '120.00'
                                status: '1'
                403:
                    description: Insufficient privileges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Ako používateľ typu Hosť nemáte oprávnenie na túto akciu.

    /cash_register_items/index/{id}:
        get:
            summary: Get cash register items
            description: |
                Get detailed information about cash register and its items.
                Optional parameters are passed as named parameters
                (e.g. `/cash_register_items/index/2/term:P2020003`).
            tags:
                - Cash register item
            parameters:
                -   name: id
                    in: path
                    required: true
                    description: Cash register ID
                    schema:
                        type: integer
                -   name: date_from
                    in: query
                    description: Date from (YYYY-MM-DD)
                    schema:
                        type: string
                        format: date
                -   name: date_to
                    in: query
                    description: Date to (YYYY-MM-DD)
                    schema:
                        type: string
                        format: date
                -   name: datefilter
                    in: query
                    description: Time filter (see Value lists > Time filters)
                    schema:
                        $ref: "#/components/schemas/TimeFilter"
                -   name: sum_from
                    in: query
                    description: Sum from
                    schema:
                        type: number
                        format: float
                -   name: sum_to
                    in: query
                    description: Sum to
                    schema:
                        type: number
                        format: float
                -   name: term
                    in: query
                    description: Filter items by search term (searches in `description` and `cash_item_no_formatted`)
                    schema:
                        type: string
                -   name: type
                    in: query
                    description: Type filter ("in" for income and "out" for outgo); both when omitted
                    schema:
                        type: string
                        enum:
                            - in
                            - out
            responses:
                200:
                    description: Successful operation
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CashRegisterItemListRes"

    /cash_register_items/delete/{id}:
        get:
            summary: Delete cash register item
            tags:
                - Cash register item
            parameters:
                -   name: id
                    in: path
                    required: true
                    description: Cash register item ID
                    schema:
                        type: integer
            responses:
                200:
                    description: Successful deletion
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CashRegisterItemDeleteRes"
                            example:
                                Summary:
                                    minus:
                                        formatted: 0,00 <span class="currency_symbol">€</span>
                                        raw: null
                                    plus:
                                        formatted: 102,00 <span class="currency_symbol">€</span>
                                        raw: '102.00'
                                    total:
                                        formatted: 102,00 <span class="currency_symbol">€</span>
                                        raw: '102.00'
                                status: 1
                400:
                    description: Wrong item
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CashRegisterItemDeleteErrorRes"
                            example:
                                Summary: 0
                                status: 0
                403:
                    description: Insufficient privileges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Ako používateľ typu Hosť nemáte oprávnenie na túto akciu.

    /cash_register_items/delete:
        post:
            summary: Delete multiple cash register items
            tags:
                - Cash register item
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CashRegisterItemDeleteReq"
            responses:
                200:
                    description: Successful deletion
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CashRegisterItemDeleteRes"
                            example:
                                Summary:
                                    minus:
                                        formatted: 0,00 <span class="currency_symbol">€</span>
                                        raw: null
                                    plus:
                                        formatted: 2,00 <span class="currency_symbol">€</span>
                                        raw: '2.00'
                                    total:
                                        formatted: 2,00 <span class="currency_symbol">€</span>
                                        raw: '2.00'
                                status: 1
                400:
                    description: Wrong item
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CashRegisterItemDeleteErrorRes"
                            example:
                                Summary: 0
                                status: 0
                403:
                    description: Insufficient privileges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Ako používateľ typu Hosť nemáte oprávnenie na túto akciu.

    /cash_register_items/receipt/{id}:
        get:
            summary: Get receipt from the cash register in PDF
            tags:
                - Cash register item
            parameters:
                -   name: id
                    in: path
                    required: true
                    description: Receipt ID
                    schema:
                        type: integer
            responses:
                200:
                    description: PDF document
                    content:
                        application/pdf:
                            schema:
                                type: string
                                format: binary
                404:
                    description: Receipt not found

    /cash_registers/getDetails:
        get:
            summary: Get cash registers details
            description: |
                Get detailed information about cash registers and its current
                value status.
            tags:
                - Cash register
            responses:
                200:
                    description: Successful operation
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/CashRegisterWrapper"
                            example:
                                -   CashRegister:
                                        currency: CZK
                                        description: My EET Cash Register
                                        id: '2'
                                        items: '2'
                                        name: CR2-EET
                                        sequencein_id: '6'
                                        sequenceout_id: '7'
                                        total: '1248.00'
                                        user_id: '1'
                                        user_profile_id: '1'

    /cash_registers/view/{id}:
        get:
            summary: Get cash register by ID
            description: |
                Get detailed information about cash register by ID.
            tags:
                - Cash register
            parameters:
                -   name: id
                    in: path
                    required: true
                    description: Cash register ID
                    schema:
                        type: integer
                    example: 1
            responses:
                200:
                    description: Successful operation
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CashRegisterWrapper"
                400:
                    description: Invalid cash register ID
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Invalid CashRegister id
                                message: Invalid CashRegister id
                404:
                    description: Cash register not found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: 'CashRegister with id: 123 not found'
                                message: 'CashRegister with id: 123 not found'

    /clients/create:
        post:
            summary: Create client
            description: |
                Create a new client. To add tags, send `Tag: {"Tag": [tagId, ...]}`
                next to `Client`.
            tags:
                - Clients
            requestBody:
                description: '`Client.name` is required.'
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ClientCreateReq"
                        example:
                            Client:
                                name: Jozef Mrkvicka
                                address: Bratislavská 123
                                city: Medzilaborce
                                country_id: 191
                                ico: '12345678'
                                dic: '2023513470'
                                email: jozef.mrkvicka@example.com
                                zip: 068 01
            responses:
                200:
                    description: |
                        Successful addition. Missing required data is also
                        returned with HTTP status 200 (`error: 1`,
                        `error_message: "Missing data"`).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ClientCreateRes"
                400:
                    description: Bad data format
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                message: Bad data format
                                error_message: Bad data format

    /clients/view/{id}:
        get:
            summary: View client detail
            tags:
                - Clients
            parameters:
                -   name: id
                    in: path
                    required: true
                    description: Client ID
                    schema:
                        type: integer
            responses:
                200:
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ClientViewRes"
                404:
                    description: Client not found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                message: Client not found
                                error_message: Client not found

    /clients/index.json/listinfo:1:
        get:
            summary: Get client list
            description: |
                Get list of clients based on filtering parameters. Parameters
                are passed as named parameters
                (e.g. `/clients/index.json/listinfo:1/search:c3VwZXJmYWt0dXJh`).
                `listinfo:1` is part of the path so the response always contains
                paging information. Without it the API returns a plain array of
                items (not modelled here).
            tags:
                - Clients
            parameters:
                -   name: direction
                    in: query
                    description: Sorting type, ASC or DESC
                    schema:
                        type: string
                        enum:
                            - ASC
                            - DESC
                        default: DESC
                -   name: page
                    in: query
                    description: Page number
                    schema:
                        type: integer
                        default: 1
                -   name: per_page
                    in: query
                    description: Number of results per page
                    schema:
                        type: integer
                -   name: sort
                    in: query
                    description: Sorting attribute
                    schema:
                        type: string
                        default: regular_count
                -   name: char_filter
                    in: query
                    description: Search by first letter of client name (non letter characters are under `#`)
                    schema:
                        type: string
                -   name: created
                    in: query
                    description: Constant specifying time filtering (see Value lists > Time filter constants)
                    schema:
                        $ref: "#/components/schemas/TimeFilterConstant"
                -   name: created_since
                    in: query
                    description: Creation date since (requires `created:3`)
                    schema:
                        type: string
                        format: date
                -   name: created_to
                    in: query
                    description: Creation date to (requires `created:3`)
                    schema:
                        type: string
                        format: date
                -   name: modified
                    in: query
                    description: Last modification date constant specifying time filtering (see Value lists > Time filter constants)
                    schema:
                        $ref: "#/components/schemas/TimeFilterConstant"
                -   name: modified_since
                    in: query
                    description: Last modification date from (requires `modified:3`)
                    schema:
                        type: string
                        format: date
                -   name: modified_to
                    in: query
                    description: Last modification date to (requires `modified:3`)
                    schema:
                        type: string
                        format: date
                -   name: search
                    in: query
                    description: |
                        Base64 encoded substring searched in name, ICO, DIC,
                        IC_DPH, bank_account, email, address, city, zip, state,
                        country, phone, fax, comment, tags and UUID
                    schema:
                        type: string
                -   name: search_uuid
                    in: query
                    description: Search by UUID
                    schema:
                        type: string
                -   name: tag
                    in: query
                    description: Tag ID
                    schema:
                        type: integer
            responses:
                200:
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ClientListRes"

    /clients/edit/{id}:
        patch:
            summary: Edit client
            description: |
                Edit an existing client. The documentation lists `name` as
                required, but the documented example sends only the changed
                attributes.
            tags:
                - Clients
            parameters:
                -   name: id
                    in: path
                    description: The ID of the client to be edited
                    required: true
                    schema:
                        type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ClientEditReq"
                        example:
                            Client:
                                uuid: 598f4b4f-6fcb-4f25-9828-bf4237a715d0
            responses:
                200:
                    description: Successful update
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Message"
                            example:
                                error: 0
                                message: The client has been saved
                400:
                    description: Bad data format
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                message: Bad data format
                                error_message: Bad data format
                403:
                    description: Insufficient permissions
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                message: You can't edit this item
                                error_message: You can't edit this item
                404:
                    description: Client not found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                message: Client not found
                                error_message: Client not found

    /clients/delete/{id}:
        delete:
            summary: Delete client
            description: Delete an existing client
            tags:
                - Clients
            parameters:
                -   name: id
                    in: path
                    description: The ID of the client to be deleted
                    required: true
                    schema:
                        type: integer
            responses:
                200:
                    description: Successful deletion
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ClientDeleteRes"
                            example:
                                redirect_url: /clients
                                error: 0
                                message: Contact deleted
                403:
                    description: Insufficient permissions or client has issued invoices
