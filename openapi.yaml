            description: |
                Parameters are passed as named parameters
                (e.g. `/accounts/index.json/date:3/date_since:2050-01-27/date_to:2050-01-27`).
            tags:
                - Other API commands
            parameters:
                -   name: direction
                    in: query
                    description: Sorting type, ASC or DESC
                    schema:
                        type: string
                        enum:
                            - ASC
                            - DESC
                        default: ASC
                -   name: page
                    in: query
                    description: Page number
                    schema:
                        type: integer
                        default: 1
                -   name: per_page
                    in: query
                    description: Number of results per page
                    schema:
                        type: integer
                -   name: sort
                    in: query
                    description: Sorting attribute
                    schema:
                        type: string
                -   name: amount_from
                    in: query
                    description: Amount from
                    schema:
                        type: number
                        format: float
                        default: 0
                -   name: amount_to
                    in: query
                    description: Amount to
                    schema:
                        type: number
                        format: float
                        default: 0
                -   name: date
                    in: query
                    description: Constant specifying time filtering (see Value lists > Time filter constants)
                    schema:
                        $ref: "#/components/schemas/TimeFilterConstant"
                -   name: date_since
                    in: query
                    description: Date from (requires `date:3`)
                    schema:
                        type: string
                        format: date
                -   name: date_to
                    in: query
                    description: Date to (requires `date:3`)
                    schema:
                        type: string
                        format: date
                -   name: move_type
                    in: query
                    description: credit or debit
                    schema:
                        type: string
                        enum:
                            - credit
                            - debit
                -   name: search
                    in: query
                    description: Base64 encoded string
                    schema:
                        type: string
