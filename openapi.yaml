                - Stock
            parameters:
                -   name: id
                    in: path
                    description: Stock item ID
                    required: true
                    schema:
                        type: integer
            responses:
                200:
                    description: Successful deletion
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StockItemDeleteRes"
                400:
                    description: Invalid item ID
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Invalid stock item id
                                message: Invalid stock item id
                403:
                    description: Insufficient privileges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Ako používateľ typu Hosť nemáte oprávnenie na túto akciu.
                                message: Ako používateľ typu Hosť nemáte oprávnenie na túto akciu.
                404:
                    description: Item not found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: StockItem not found
                                message: StockItem not found
                500:
                    description: Unsuccessful deletion
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 2
                                error_message: Error deleting stock item.

    /stock_items/addStockMovement:
        post:
            summary: Add stock movement
            description: Either `sku` or `stock_item_id` is required for each movement.
            tags:
                - Stock
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/StockMovementAddReq"
                        example:
                            StockLog:
                                -   currency: EUR
                                    purchase_currency: SEK
                                    purchase_unit_price: 0.97
                                    purchase_tax: 22
                                    quantity: 5
                                    sku: itemb1241
                                    unit_price: 1.23
                                    tax: 25
            responses:
                200:
                    description: Successfully added
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StockMovementAddRes"
                            example:
                                data:
                                    StockLog:
                                        -   currency: EUR
                                            id: 0
                                            log_data: '{"purchase_unit_price":0.97,"purchase_tax":22,"purchase_currency":"SEK","unit_price":1.23,"tax":25,"currency":"EUR"}'
                                            purchase_currency: SEK
                                            purchase_tax: 22
                                            purchase_unit_price: 0.97
                                            quantity: 5
                                            sku: itemb1241
                                            stock_item_id: '1'
                                            tax: 25
                                            unit_price: 1.23
                                error: 0
                                error_message: ''
                400:
                    description: Invalid data
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 3
                                error_message: StockItem empty data.

    /stock_items/movements/{id}:
        get:
            summary: Get stock logs of item
            description: |
                Optional parameters are passed as named parameters
                (e.g. `/stock_items/movements/1/page:2/per_page:2`).
            tags:
                - Stock
            parameters:
                -   name: id
                    in: path
                    description: Stock item ID
                    required: true
                    schema:
                        type: integer
                -   name: direction
                    in: query
                    description: Sorting type, ASC or DESC
                    schema:
                        type: string
                        enum:
                            - ASC
                            - DESC
                        default: ASC
                -   name: page
                    in: query
                    description: Page number
                    schema:
                        type: integer
                        default: 1
                -   name: per_page
                    in: query
                    description: Number of results per page
                    schema:
                        type: integer
                -   name: sort
                    in: query
                    description: Sorting attribute
                    schema:
                        type: string
            responses:
                200:
                    description: Successfully showing logs
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StockLogListRes"
                            example:
                                itemCount: 9
                                pageCount: 5
                                perPage: 2
                                page: 2
                                items:
                                    -   StockLog:
                                            id: '1'
                                            stock_item_id: '9'
                                            user_id: '22'
                                            user_profile_id: '12'
                                            invoice_id: null
                                            expense_id: null
                                            document_item_id: null
                                            quantity: 0
                                            note: Ručná úprava stavu na sklade
                                            document: null
                                            document_subtype: null
                                            log_data: '{"purchase_unit_price":"0.1200","purchase_tax":null,"unit_price":"0.1","tax":20,"currency":"EUR","home_currency":"EUR"}'
                                            created: '2050-10-10 09:27:17'
                                            modified: '2050-10-10 09:27:17'
                404:
                    description: Wrong stock item
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: StockItem not found
                                message: StockItem not found

    /tags/add:
        post:
            summary: Add tag
            description: Adds a new tag
            tags:
                - Tags
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TagSaveReq"
                        example:
                            name: abc
            responses:
                201:
                    description: Successfully added tag
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TagAddRes"
                            example:
                                error: 0
                                message: Tag bol uložený
                                tag_id: '1'
                                tag_name: abc
                400:
                    description: Wrong data
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Chýbajúce údaje
                                message: Chýbajúce údaje
                403:
                    description: Insufficient privileges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Nemôžete pridávať tagy
                                message: Nemôžete pridávať tagy
                409:
                    description: Duplicate name
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Tento tag už existuje
                                message: Tento tag už existuje

    /tags/edit/{id}:
