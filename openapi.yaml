                                            phone: '123000456'
                                            text: helloworld
                                        error: 0
                                        error_message: SMS sent
                                noPrepaidSms:
                                    value:
                                        error: 3
                                        message: 'SMS not sent: Nedostatok voľných sms'
                                invalidPhone:
                                    value:
                                        error: 3
                                        message: 'SMS not sent: Neplatné tel. číslo'
                                invoiceNotFound:
                                    value:
                                        error: 2
                                        message: Invoice not found
                                emptyFields:
                                    value:
                                        error: 1
                                        message: Invoice ID and text cannot be empty

