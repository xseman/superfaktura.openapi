                    schema:
                        type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TagSaveReq"
                        example:
                            name: xyz
            responses:
                200:
                    description: Successfully edited tag
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TagEditRes"
                            example:
                                error: 0
                                message: Tag bol uložený
                                tag_id: '1'
                400:
                    description: Bad data
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Chýbajúce údaje
                                message: Chýbajúce údaje
                403:
                    description: Insufficient privileges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
