                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Žiadny tag sa nenašiel
                                message: Žiadny tag sa nenašiel

    /tags/index.json:
        get:
            summary: Get list of tags
            description: |
                Returns a JSON object in form of `key: value`, where `key` is
                tag ID and `value` is tag name. If no tags are found, an empty
                array `[]` is returned.
            tags:
                - Tags
            responses:
                200:
                    description: Successfully retrieved list of tags
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    -   type: object
                                        additionalProperties:
                                            type: string
                                    -   type: array
                                        maxItems: 0
                                        items: {}
                            example:
                                '1': abc
                403:
                    description: Insufficient privileges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Nemôžete zobrazovať tagy
                                message: Nemôžete zobrazovať tagy

