    /sms/send:
        post:
            summary: Send SMS reminder
            description: |
                Send a reminder before or after the maturity of invoices via
                SMS. This feature requires you to have bought SMS messages
                (*Tools > SMS*).
            tags:
                - Other API commands
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SmsSendReq"
                        example:
                            invoice_id: 1
                            text: helloworld
                            phone: '123000456'
            responses:
                200:
                    description: |
                        Result. Errors: `error: 1` empty required fields,
                        `error: 2` invoice not found, `error: 3` SMS not sent
                        (no prepaid SMS, invalid phone number).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SmsSendRes"
                            examples:
                                success:
                                    value:
