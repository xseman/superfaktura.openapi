                                error_message: Export not found

    /exports/download_export/{id}:
        get:
            summary: Download export
            description: |
                Download the completed export by its ID. Exports are available
                for download for two days from the time of completion.
            tags:
                - Export
            parameters:
                -   in: path
                    name: id
                    required: true
