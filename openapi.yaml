                            schema:
                                $ref: "#/components/schemas/Message"
                            example:
                                error: 0
                                message: Tag zmazaný
                403:
                    description: Insufficient privileges
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Nemôžete mazať tagy
                                message: Nemôžete mazať tagy
                404:
                    description: Wrong tag
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: 1
                                error_message: Žiadny tag sa nenašiel
                                message: Žiadny tag sa nenašiel

    /countries:
        get:
            summary: Get list of countries
            description: |
                Get a list of countries in `id: country_name` format.
            tags:
                - Value lists
            responses:
                200:
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties:
                                    type: string
                            example:
                                '1': Afganistan
                                '10': Argentina
                                '100': Iceland

    /countries/index/view_full:1:
        get:
            summary: Get detailed list of countries
            description: |
                Get a detailed list of countries with additional information.
                `iso` is the ISO-3166-1 (Alpha-2) country code, `eu` tells
                whether the country is in the European Union.
            tags:
                - Value lists
            operationId: getDetailedCountries
            responses:
                200:
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/CountryWrapper"
                            example:
                                -   Country:
                                        eu: true
                                        id: 191
                                        iso: sk
                                        name: Slovensko
                                -   Country:
                                        eu: false
                                        id: 1
                                        iso: af
                                        name: Afganistan

    /currencies:
        get:
            summary: Get list of currencies
            description: |
                Get a list of currencies in ISO-4217 format. This endpoint is
                not present in the official documentation; the documented list
                of accepted currencies is the `Currency` schema (Value lists >
                Currencies).
            tags:
                - Value lists
            responses:
                200:
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties:
                                    type: string
                            example:
                                AED: Uae Dirham
                                AFN: Afghani
                                ALL: Albanian lek

    /expenses/expense_categories:
        get:
            summary: Get list of expense categories
            description: |
                Returns a JSON array of expense categories. The hierarchical
                structure is modelled via `children` (and `lft` / `rght`,
                *Modified Preorder Tree Traversal*).
            tags:
                - Value lists
            responses:
                200:
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/ExpenseCategory"
                            example:
                                -   children:
                                        -   children: []
                                            icon: bolt
                                            icon_color: '#1c212b'
                                            id: 2
                                            name: Nájomné / energie
                                    icon: building
                                    icon_color: '#3a4345'
                                    id: 1
                                    name: Kancelária

