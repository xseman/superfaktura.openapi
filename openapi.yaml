openapi: 3.0.0

info:
    title: superfaktura.sk API
    version: 1.0.0
    description: |
        Pomocou API môžete SuperFaktúru prepojiť napríklad s vašim e-shopom, CRM
        systémom alebo vašou webovou stránkou s objednávkovým formulárom a
        vystavovať faktúry zákazníkom automaticky.

        **POST data format** – POST requests accept either `application/json`
        (body is the JSON document itself) or
        `application/x-www-form-urlencoded` (the JSON document is sent URL
        encoded in the `data` form field). This specification describes the
        JSON body.

        **Named parameters** – list endpoints read optional parameters as
        CakePHP named parameters appended to the URL path in the form
        `/name:value` (e.g. `/invoices/index.json/listinfo:1/per_page:10`),
        not as a query string. OpenAPI cannot express them, so they are
        described as query parameters; clients have to move them into the
        path (see the README for a middleware doing that).

        **Rate limits** – responses carry `X-RateLimit-DailyLimit`,
        `X-RateLimit-DailyRemaining`, `X-RateLimit-DailyReset`,
        `X-RateLimit-MonthlyLimit`, `X-RateLimit-MonthlyRemaining`,
        `X-RateLimit-MonthlyReset` and `X-RateLimit-Message` headers.

        **Base64 search strings** – when a base64 encoded value is passed in a
        `GET` request, replace `+` with `-`, `/` with `_` and `=` with `,`.

externalDocs:
    url: https://github.com/superfaktura/docs/

servers:
